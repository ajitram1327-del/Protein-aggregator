[project]
name = "scrapling-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.23.0",
    "groq>=1.7.0",
    "pillow>=12.3.0",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "scrapling[all]>=0.4.15",
    "supabase>=2.31.0",
]

[project.scripts]
scrapling-scraper = "scrapling_scraper:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
